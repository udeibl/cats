<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SYSTEM BREACH</title>
<style>
  :root{
    --grid-green:#0aff6e;
    --grid-green-dim:#0aff6e55;
    --red:#ff163c;
    --red-glow:#ff163c99;
    --bg:#020403;
    --amber:#ffb020;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Courier New',monospace;}

  /* ---------- MATRIX RAIN ---------- */
  #rain{position:fixed;inset:0;z-index:0;opacity:0.55;}

  /* ---------- CRT / VIGNETTE ---------- */
  .crt{
    position:fixed;inset:0;z-index:20;pointer-events:none;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%),
      repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.35) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;
  }
  .flicker{
    position:fixed;inset:0;z-index:21;pointer-events:none;
    background:rgba(10,255,110,0.02);
    animation:flick 0.15s infinite;
  }
  @keyframes flick{
    0%{opacity:0.3;} 50%{opacity:0.7;} 100%{opacity:0.4;}
  }

  /* ---------- LAYOUT ---------- */
  .stage{
    position:fixed;inset:0;z-index:5;
    display:flex;flex-direction:column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;letter-spacing:2px;color:var(--grid-green);
    border-bottom:1px solid var(--grid-green-dim);
    padding-bottom:8px;text-shadow:0 0 6px var(--grid-green);
    opacity:0;animation:fadeIn 0.6s ease forwards;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--grid-green);box-shadow:0 0 10px var(--grid-green);animation:blink 0.9s infinite alternate;}

  .id-badge{
    text-align:center;margin-top:10px;font-size:10px;letter-spacing:4px;color:var(--grid-green-dim);
    opacity:0;animation:fadeIn 0.6s ease 0.2s forwards;
  }

  #console{
    flex:1;margin-top:18px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:flex-end;
    font-size:13px;line-height:1.55;color:var(--grid-green);
  }
  .ln{opacity:0;transform:translateY(4px);animation:lnIn 0.18s ease forwards;text-shadow:0 0 4px var(--grid-green);}
  .ln.warn{color:var(--amber);text-shadow:0 0 4px var(--amber);}
  .ln.bad{color:var(--red);text-shadow:0 0 6px var(--red);}
  .ln::before{content:"root@target:~$ ";opacity:0.55;}

  .bar-wrap{margin:2px 0 6px 0;font-size:12px;color:var(--grid-green-dim);}
  .bar-track{width:100%;height:6px;background:#0a1a10;border:1px solid var(--grid-green-dim);margin-top:3px;overflow:hidden;}
  .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--grid-green),#7dffb8);box-shadow:0 0 8px var(--grid-green);}

  @keyframes lnIn{to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{to{opacity:1;}}
  @keyframes blink{from{opacity:1;}to{opacity:0.15;}}

  /* ---------- BREACH OVERLAY ---------- */
  #breach{
    position:fixed;inset:0;z-index:30;
    display:none;
    background:rgba(6,0,1,0.92);
    flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  #breach.show{display:flex;animation:slam 0.25s ease;}
  @keyframes slam{from{opacity:0;transform:scale(1.08);}to{opacity:1;transform:scale(1);}}

  .skull{
    font-size:15vw;line-height:1;color:var(--red);
    text-shadow:0 0 20px var(--red), 0 0 45px var(--red-glow);
    animation:pulseSkull 0.7s infinite alternate;
  }
  @keyframes pulseSkull{from{transform:scale(1);}to{transform:scale(1.06);}}

  .breach-title{
    margin-top:14px;font-size:clamp(22px,7vw,34px);font-weight:700;letter-spacing:3px;
    color:var(--red);text-shadow:0 0 10px var(--red);
  }
  .breach-sub{
    margin-top:14px;font-size:13px;line-height:1.6;color:#fff;max-width:340px;
    text-shadow:0 0 6px rgba(255,255,255,0.6);
    min-height:90px;
  }
  .breach-sub .cursor{display:inline-block;width:8px;background:#fff;animation:blink 0.6s infinite;}

  .breach-foot{
    margin-top:22px;font-size:10px;letter-spacing:2px;color:var(--red-glow);
  }

  .shake{animation:shakeIt 0.35s;}
  @keyframes shakeIt{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-6px,3px);}
    40%{transform:translate(5px,-4px);}
    60%{transform:translate(-4px,-2px);}
    80%{transform:translate(6px,2px);}
  }

  .bottombar{
    display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;
    color:rgba(10,255,110,0.45);border-top:1px solid var(--grid-green-dim);padding-top:6px;
    opacity:0;animation:fadeIn 0.6s ease 0.3s forwards;
  }

  #unlock{position:fixed;inset:0;z-index:99;background:transparent;}
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="crt"></div>
<div class="flicker"></div>
<div id="unlock"></div>

<div class="stage" id="stage">
  <div class="topbar">
    <span>[ INTRUSION_KIT // v9.ULI ]</span>
    <div class="dot"></div>
  </div>
  <div class="id-badge">TARGET LOCKED · NFC-CHANNEL · AES BYPASS ENGAGED</div>

  <div id="console"></div>

  <div class="bottombar">
    <span>NODE::ULI_MOBILE</span>
    <span id="clock">00:00:00.0</span>
  </div>
</div>

<div id="breach">
  <div class="skull">☠</div>
  <div class="breach-title">GERÄT KOMPROMITTIERT</div>
  <div class="breach-sub" id="breachText"></div>
  <div class="breach-foot">DIESER HACK WAR NUR EIN SCHERZ · KEINE DATEN WURDEN BERÜHRT</div>
</div>

<script>
/* ============ MATRIX RAIN ============ */
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize(); addEventListener('resize', resize);

const glyphs = "アイウエオカキクケコサシスセソ01アイウエ0101ΞΦΨΩ01#$%&";
const fontSize = 16;
let columns = Math.floor(canvas.width/fontSize);
let drops = new Array(columns).fill(1);

function drawRain(){
  ctx.fillStyle = "rgba(2,4,3,0.12)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font = fontSize+"px monospace";
  for(let i=0;i<drops.length;i++){
    const text = glyphs[Math.floor(Math.random()*glyphs.length)];
    const isHead = Math.random() > 0.92;
    ctx.fillStyle = isHead ? "#c8ffe0" : "rgba(10,255,110,0.75)";
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
    if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
      drops[i] = 0;
    }
    drops[i]++;
  }
}
setInterval(drawRain, 45);

/* ============ AUDIO ============ */
let audioCtx = null;
function initAudio(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } }

function beep(freq=700, type='sawtooth', dur=0.05, vol=0.1){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function alarmSweep(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  for(let i=0;i<3;i++){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1400, now + i*0.35);
    osc.frequency.linearRampToValueAtTime(500, now + i*0.35 + 0.25);
    gain.gain.setValueAtTime(0.16, now + i*0.35);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.35 + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now + i*0.35); osc.stop(now + i*0.35 + 0.3);
  }
}

function vibrate(pattern){ if(navigator.vibrate){ navigator.vibrate(pattern); } }

/* ============ CLOCK ============ */
setInterval(()=>{
  const n = new Date();
  document.getElementById('clock').innerText =
    n.toTimeString().split(' ')[0] + "." + Math.floor(n.getMilliseconds()/100);
}, 100);

/* ============ TERMINAL SEQUENCE ============ */
const consoleEl = document.getElementById('console');
const stage = document.getElementById('stage');

const sequence = [
  {text:"nfc.scan() → device found [MOBILE-CLIENT]", type:"ln"},
  {text:"handshake initiated on channel 0x4F", type:"ln"},
  {text:"probing open ports... 3 found", type:"ln"},
  {text:"firmware version leaked: unverifiable", type:"warn"},
  {bar:"bypassing sandbox isolation"},
  {text:"sandbox isolation: DISABLED", type:"bad"},
  {text:"escalating privileges...", type:"ln"},
  {bar:"dumping memory block 0x8F902A"},
  {text:"credential cache located", type:"warn"},
  {bar:"injecting payload"},
  {text:"payload injected — persistence hook set", type:"bad"},
  {text:"disabling local defenses...", type:"ln"},
  {text:"root access: GRANTED", type:"bad"},
];

let step = 0;

function addLine(item){
  return new Promise(resolve=>{
    if(item.bar){
      const wrap = document.createElement('div');
      wrap.className = 'bar-wrap ln';
      wrap.innerHTML = item.bar.toUpperCase()+' <span class="pct">0%</span><div class="bar-track"><div class="bar-fill"></div></div>';
      consoleEl.appendChild(wrap);
      const fill = wrap.querySelector('.bar-fill');
      const pct = wrap.querySelector('.pct');
      let p = 0;
      const iv = setInterval(()=>{
        p += Math.random()*18 + 8;
        if(p >= 100){ p = 100; clearInterval(iv); resolve(); }
        fill.style.width = p+'%';
        pct.textContent = Math.floor(p)+'%';
        beep(500 + p*4, 'triangle', 0.03, 0.05);
      }, 90);
    } else {
      const line = document.createElement('div');
      line.className = 'ln ' + (item.type||'');
      line.textContent = item.text;
      consoleEl.appendChild(line);
      beep(600 + step*40, 'sawtooth', 0.05, 0.06);
      if(item.type === 'bad'){
        stage.classList.add('shake');
        vibrate(40);
        setTimeout(()=>stage.classList.remove('shake'), 350);
      }
      resolve();
    }
    while(consoleEl.children.length > 9){ consoleEl.removeChild(consoleEl.firstChild); }
  });
}

async function runSequence(){
  initAudio();
  for(step=0; step<sequence.length; step++){
    await addLine(sequence[step]);
    await new Promise(r=>setTimeout(r, 90 + Math.random()*160));
  }
  setTimeout(triggerBreach, 500);
}

/* ============ FINAL BREACH SCREEN ============ */
function triggerBreach(){
  alarmSweep();
  vibrate([100,60,100,60,300]);
  document.getElementById('breach').classList.add('show');

  const msg = "Über die NFC-Schnittstelle wurde eine ungesicherte Verbindung erkannt.\n\nULI hat die Kontrolle über dieses Gerät übernommen.";
  const target = document.getElementById('breachText');
  let i = 0;
  target.innerHTML = '<span class="cursor">&nbsp;</span>';

  function type(){
    if(i < msg.length){
      const ch = msg.charAt(i);
      target.innerHTML = msg.slice(0, i+1).replace(/\n/g,'<br>') + '<span class="cursor">&nbsp;</span>';
      if(ch !== ' ' && ch !== '\n'){ beep(1100, 'square', 0.025, 0.07); }
      i++;
      setTimeout(type, 28);
    }
  }
  type();

  // periodic alarm pulses to keep tension up
  let pulses = 0;
  const pulseIv = setInterval(()=>{
    stage.classList.add('shake');
    setTimeout(()=>stage.classList.remove('shake'), 300);
    beep(1300, 'square', 0.06, 0.05);
    pulses++;
    if(pulses > 6){ clearInterval(pulseIv); }
  }, 1400);
}

/* ============ START ============ */
window.addEventListener('load', ()=>{
  setTimeout(runSequence, 500);
});
document.getElementById('unlock').addEventListener('click', ()=>{
  initAudio();
  document.getElementById('unlock').remove();
});
document.getElementById('unlock').addEventListener('touchstart', ()=>{
  initAudio();
});
</script>
</body>
</html>
